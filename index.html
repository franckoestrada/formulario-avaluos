<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Principal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #e3eaf6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    .main-container {
      text-align: center;
      background: white;
      padding: 50px 70px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid #ddd;
    }
    h1 {
      margin-bottom: 40px;
      font-size: 36px;
      color: #222;
      font-weight: 600;
    }
    .btn {
      display: block;
      width: 280px;
      margin: 15px auto;
      padding: 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .btn:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <h1>Menú Principal</h1>
    <button class="btn" onclick="location.href='registro_avaluos.html'">📄 Registrar Avalúo</button>
    <button class="btn" onclick="location.href='buscar_avaluos.html'">🔍 Buscar Avalúos</button>
    <button class="btn" onclick="location.href='dashboard.html'">📊 Avances</button>
  </div>
</body>
</html>
